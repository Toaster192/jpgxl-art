<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtXL</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <div id="top-right-btns">
    <button id="saved-btn">Saved</button>
    <button id="gallery-btn">Gallery</button>
  </div>
  <div id="layout">
    <div id="left-pane">
      <h1>ArtXL — tree-based image mutation</h1>
      <p id="status">Loading…</p>

      <h2>Program</h2>
      <div id="editor-wrap">
        <textarea id="program" spellcheck="false"></textarea>
        <div class="btn-row">
          <div class="btn-group">
            <button id="render-single-btn" class="render-btn">Render</button>
            <button id="render-single-preview-btn" class="preview-btn">320px</button>
            <button id="render-single-large-btn" class="preview-btn">2048px</button>
          </div>
          <div class="btn-group">
            <button id="render-btn" class="render-btn">Render + mutations</button>
            <button id="render-preview-btn" class="preview-btn">320px</button>
            <button id="render-large-btn" class="preview-btn">2048px</button>
          </div>
          <div class="btn-group">
            <button id="render-compound-btn" class="render-btn">Render + 20 compound</button>
            <button id="render-compound-preview-btn" class="preview-btn">320px</button>
            <button id="render-compound-large-btn" class="preview-btn">2048px</button>
          </div>
        </div>
        <div class="btn-row">
          <div class="btn-group">
            <button id="random-btn">Randomize</button>
            <button id="random-simple-btn" class="preview-btn" title="Smaller decision tree">Simple</button>
            <button id="random-complex-btn" class="preview-btn" title="Deeper decision tree">Complex</button>
          </div>
          <div class="btn-group">
            <button id="random20-btn">Randomize 20</button>
            <button id="random20-simple-btn" class="preview-btn" title="Smaller decision tree">Simple</button>
            <button id="random20-complex-btn" class="preview-btn" title="Deeper decision tree">Complex</button>
          </div>
        </div>
        <div id="error-msg"></div>
      </div>
    </div>

    <div id="right-pane">
      <h2>Rendered images</h2>
      <div id="gallery"></div>
    </div>
  </div>

  <!-- Comparison bar (fixed, bottom of viewport) -->
  <div id="compare-bar">
    <div id="compare-header">
      <span>Comparison — click an image to pin/unpin</span>
      <button id="compare-clear">✕ clear all</button>
    </div>
    <div id="compare-images"></div>
  </div>

  <!-- Zoom modal -->
  <div id="zoom-modal">
    <canvas id="zoom-canvas"></canvas>
    <div id="zoom-status"></div>
  </div>

  <script src="app.js?v=17"></script>
</body>
</html>
