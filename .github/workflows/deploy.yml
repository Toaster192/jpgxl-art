name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/jxlart
            git pull origin main
            # Ensure the libjxl tools exist (jxl_from_tree encoder + djxl
            # decoder). Idempotent — a no-op once both are built; only the
            # first run after djxl was introduced does the ~5-10 min libjxl
            # build. (Recommended: run `make setup` on the box once before the
            # first deploy of this change so this step stays fast.)
            make setup
            # Build first; if this fails, the running service stays on the
            # last good binary instead of being restarted into nothing.
            ~/.cargo/bin/cargo build --release
            sudo systemctl restart jxlart
            # Startup pre-renders the gallery before the listener binds
            # (~minutes on the deploy box), so poll for up to 6 minutes before
            # giving up. Surface the pre-render progress ("[N/226] …") the
            # service logs to journald so this wait isn't a silent black box —
            # `systemctl status` is already permitted by the deploy sudoers.
            last=""
            for _ in $(seq 1 72); do
              if curl -fsS --max-time 5 http://localhost:3000/api/generate >/dev/null 2>&1; then
                echo "Service responsive"
                exit 0
              fi
              prog=$(sudo systemctl status jxlart 2>/dev/null \
                | grep -oE 'Pre-rendering gallery \([0-9]+ entries\)|\[[0-9]+/[0-9]+\].*' \
                | tail -1 || true)
              if [ -n "$prog" ] && [ "$prog" != "$last" ]; then
                echo "  $prog"
                last="$prog"
              fi
              sleep 5
            done
            echo "Service did not become responsive within 6 minutes" >&2
            exit 1
