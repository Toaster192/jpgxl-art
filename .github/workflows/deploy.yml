name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/jxlart
            git pull origin main
            # Build first; if this fails, the running service stays on the
            # last good binary instead of being restarted into nothing.
            ~/.cargo/bin/cargo build --release
            sudo systemctl restart jxlart
            # Startup pre-renders the gallery before the listener binds
            # (~4 min on the deploy box), so poll for up to 6 minutes
            # before giving up.
            for _ in $(seq 1 72); do
              if curl -fsS --max-time 5 http://localhost:3000/api/generate >/dev/null 2>&1; then
                echo "Service responsive"
                exit 0
              fi
              sleep 5
            done
            echo "Service did not become responsive within 6 minutes" >&2
            exit 1
